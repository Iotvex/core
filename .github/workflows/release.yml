name: release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cocogitto 7.0.0
        run: |
          set -euo pipefail
          VERSION=7.0.0
          TAR="cocogitto-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "/tmp/${TAR}" \
            "https://github.com/cocogitto/cocogitto/releases/download/${VERSION}/${TAR}"
          tar --strip-components=1 -xzf "/tmp/${TAR}" \
            -C "$HOME/.local/bin" \
            x86_64-unknown-linux-musl/cog
          chmod +x "$HOME/.local/bin/cog" \
            scripts/last-stable-tag.sh \
            scripts/cog-changelog-mode.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cog --version

      - name: Check Conventional Commits
        run: cog check --from-latest-tag

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: SemVer bump
        id: bump
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            # Pre-release: tag + manifest sync only (no CHANGELOG.md).
            LATEST_TAG="$(git tag --merged HEAD --list 'v*' | sort -V | tail -n1 || true)"
          else
            # Stable: commits since the last stable tag (ignore -dev.* tags).
            LATEST_TAG="$(bash scripts/last-stable-tag.sh || true)"
          fi

          echo "Baseline tag: ${LATEST_TAG:-<none>}"

          if [ -n "${LATEST_TAG}" ]; then
            RANGE="${LATEST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          echo "Commits in range ${RANGE}:"
          git log ${RANGE} --oneline || true

          RELEASABLE="$(git log ${RANGE} --pretty=%s | grep -E '^(feat|fix)(\(.+\))?(!)?:' || true)"
          if [ -z "${RELEASABLE}" ]; then
            echo "No feat/fix commits since ${LATEST_TAG:-repo start}; skip bump"
            exit 1
          fi

          echo "Releasable commits:"
          printf '%s\n' "${RELEASABLE}"

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "Pre-release bump on dev (dev.*), CHANGELOG skipped"
            bash scripts/cog-changelog-mode.sh disable
            cog bump --auto --pre "dev.*"
          else
            echo "Stable bump on main, updating CHANGELOG"
            bash scripts/cog-changelog-mode.sh enable
            cog bump --auto
            bash scripts/cog-changelog-mode.sh disable
            git add cog.toml
            git commit --amend --no-edit
          fi

          VERSION="$(git tag --points-at HEAD | head -n1)"
          if [ -z "${VERSION}" ]; then
            VERSION="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          fi
          if [ -z "${VERSION}" ]; then
            echo "Bump produced no tag on HEAD"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${VERSION}"

      - name: Push release commit and tag
        if: steps.bump.outcome == 'success' && steps.bump.outputs.version != ''
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "refs/tags/${VERSION}"

      - name: Build GitHub Release notes
        if: steps.bump.outcome == 'success' && steps.bump.outputs.version != ''
        run: |
          cog changelog --at "${{ steps.bump.outputs.version }}" -t full_hash > GITHUB_CHANGELOG.md
          cat GITHUB_CHANGELOG.md

      - name: Publish GitHub Release
        if: steps.bump.outcome == 'success' && steps.bump.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: ${{ steps.bump.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          body_path: GITHUB_CHANGELOG.md
          generate_release_notes: false
          prerelease: ${{ github.ref_name == 'dev' }}

      - name: No release needed
        if: steps.bump.outcome != 'success' || steps.bump.outputs.version == ''
        run: echo "No SemVer bump for this push (chore/docs-only or already released)."
